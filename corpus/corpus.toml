# Corpus registry — SPEC-003 amendment, step 2.
#
# `status` is the approval gate, not a comment:
#   ingested        — in the corpus today.
#   probe-candidate — approved as a PROBE SET only (owner, 2026-08-02).
#                     Fetching one to evaluate it is authorised; ingesting one
#                     is NOT. Selection, near-miss criteria, and the ladder stay
#                     Draft until the probe output has been read.
#
# `min_bytes` is per document on purpose. A single global floor would reject the
# smaller NIST publications while passing a WAF challenge page served in place of
# a 700 KB regulation, so each floor is sized to the document it protects — set
# to roughly half the observed size, which catches a truncated or substituted
# response without failing on a routine revision.
#
# `estimated_chunks` is a fetch-planning estimate carried over from the SPEC-003
# amendment. It is never a target and nothing depends on it being right.

