[project]
name = "enterprise-rag-qa"
version = "0.1.0"
description = "Retrieval-augmented Q&A over enterprise compliance documents"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pgvector>=0.3",
    "tiktoken>=0.8",
    "pypdf>=6.14.2",
    "beautifulsoup4>=4.15.0",
    "lxml>=6.1.1",
    "pysbd>=0.3.4",
    "openai>=2.48.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio==1.4.0",
    "httpx>=0.27",
    "ruff>=0.8",
    "pyright>=1.1.390",
    "pre-commit>=4.0",
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_qa"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Breadcrumb separator and legal-text dashes are intentional, not typos.
allowed-confusables = ["›", "–", "—", "’"]

[tool.ruff.lint.per-file-ignores]
# Synthetic corpus fixtures embed long verbatim HTML lines.
"tests/conftest.py" = ["E501"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.12"
venvPath = "."
venv = ".venv"
strict = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import scripts.fetch_corpus
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
